
name: Build AntiKB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o antikb-fabric-26.3-cloud-build.zip
          cd antikb
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod
        run: cd "$PROJECT_DIR" && gradle --no-daemon build

      - uses: actions/upload-artifact@v4
        with:
          name: AntiKB-Fabric-26.3
          path: antikb/build/libs/*.jar
